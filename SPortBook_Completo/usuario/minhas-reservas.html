<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhas Reservas | SPortBook</title><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body><script>
const s=requireSession('user');if(s){const d=getDB();renderLayout('user','minhas-reservas.html','Minhas reservas',`<div class="hero"><h1>Minhas reservas</h1><p>Consulte ou cancele suas reservas.</p></div><div class="card"><div id="list"></div></div>`);
function draw(){const d=getDB(),rs=d.reservations.filter(r=>r.userId===s.id&&r.status==='confirmed').sort((a,b)=>a.data.localeCompare(b.data));document.getElementById('list').innerHTML=rs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Quadra</th><th>Data</th><th>Horário</th><th>Status</th><th>Ação</th></tr></thead><tbody>${rs.map(r=>{const q=d.quadras.find(x=>x.id===r.quadraId);return `<tr><td>${esc(q?.nome)} - ${esc(q?.tipo)}</td><td>${dateBR(r.data)}</td><td>${r.inicio} - ${r.fim}</td><td><span class="status confirmed">Confirmada</span></td><td><button class="btn btn-danger btn-small" onclick="cancelRes(${r.id})">Cancelar</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Você ainda não possui reservas.</div>'}
window.cancelRes=id=>{if(!confirm('Cancelar esta reserva?'))return;const d=getDB(),r=d.reservations.find(x=>x.id===id);if(r){r.status='cancelled';saveDB(d);toast('Reserva cancelada.');draw()}};draw();}
</script></body></html>
