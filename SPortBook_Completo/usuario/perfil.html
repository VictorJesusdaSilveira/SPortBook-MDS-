<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil | SPortBook</title><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body><script>
const s=requireSession('user');if(s){renderLayout('user','perfil.html','Perfil',`<div class="card" style="max-width:650px"><h2>Meu perfil</h2><div class="field"><label>Nome</label><input id="nome" value="${esc(s.nome)}"></div><br><div class="field"><label>E-mail</label><input value="${esc(s.email)}" disabled></div><br><button class="btn btn-primary" onclick="saveProfile()">Salvar alterações</button></div>`);
window.saveProfile=()=>{const d=getDB(),u=d.users.find(x=>x.id===s.id);if(u){u.nome=nome.value;saveDB(d);setSession({...s,nome:u.nome});initHeader('user');toast('Perfil atualizado!')}}}
</script></body></html>
