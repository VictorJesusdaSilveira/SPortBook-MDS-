<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | SPortBook</title><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body><script>
const s=requireSession('admin');if(s){const d=getDB();renderLayout('admin','inicio.html','Painel',`<div class="hero"><h1>Painel administrativo</h1><p>Controle usuários, reservas, quadras e horários do SPortBook.</p></div><div class="stats"><div class="stat"><span>Usuários</span><strong>${d.users.length}</strong></div><div class="stat"><span>Reservas ativas</span><strong>${d.reservations.filter(r=>r.status==='confirmed').length}</strong></div><div class="stat"><span>Quadras ativas</span><strong>${d.quadras.filter(q=>q.ativa).length}</strong></div><div class="stat"><span>Bloqueios</span><strong>${d.blocked.length}</strong></div></div><div class="card"><h2>Ações rápidas</h2><div class="actions"><a class="btn btn-primary" href="reservas.html">Gerenciar reservas</a><a class="btn btn-outline" href="quadras.html">Gerenciar quadras</a><a class="btn btn-outline" href="horarios.html">Bloquear horário</a><a class="btn btn-outline" href="usuarios.html">Gerenciar usuários</a></div></div>`)}
</script></body></html>
