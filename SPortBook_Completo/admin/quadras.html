<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quadras | SPortBook</title><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body><script>
const s=requireSession('admin');if(s){renderLayout('admin','quadras.html','Quadras',`<div class="hero"><h1>Quadras</h1><p>Cadastre e ative ou desative as quadras.</p></div><div class="card"><div class="actions" style="margin-bottom:15px"><button class="btn btn-primary" onclick="openQ()">+ Nova quadra</button></div><div id="table"></div></div><div id="modal" class="modal-back"><div class="modal"><div class="modal-head"><h2>Nova quadra</h2><button class="close" onclick="modal.classList.remove('show')">×</button></div><form id="qf"><div class="field"><label>Nome</label><input id="qn" required placeholder="Quadra 3"></div><br><div class="field"><label>Tipo</label><input id="qt" required placeholder="Futsal"></div><br><button class="btn btn-primary">Cadastrar</button></form></div></div>`);
function draw(){const d=getDB();table.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Nome</th><th>Tipo</th><th>Status</th><th>Ação</th></tr></thead><tbody>${d.quadras.map(q=>`<tr><td>${esc(q.nome)}</td><td>${esc(q.tipo)}</td><td><span class="status ${q.ativa?'confirmed':'cancelled'}">${q.ativa?'Ativa':'Inativa'}</span></td><td><button class="btn btn-outline btn-small" onclick="toggleQ(${q.id})">${q.ativa?'Desativar':'Ativar'}</button></td></tr>`).join('')}</tbody></table></div>`}
window.openQ=()=>modal.classList.add('show');qf.onsubmit=e=>{e.preventDefault();const d=getDB();d.quadras.push({id:d.nextId++,nome:qn.value,tipo:qt.value,ativa:true});saveDB(d);modal.classList.remove('show');qf.reset();draw();toast('Quadra cadastrada.')};window.toggleQ=id=>{const d=getDB(),q=d.quadras.find(x=>x.id===id);q.ativa=!q.ativa;saveDB(d);draw();toast('Status atualizado.')};draw();}
</script></body></html>
