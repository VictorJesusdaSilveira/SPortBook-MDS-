<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários | SPortBook</title><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body><script>
const s=requireSession('admin');if(s){renderLayout('admin','usuarios.html','Usuários',`<div class="hero"><h1>Usuários</h1><p>Cadastro e manutenção dos usuários do sistema.</p></div><div class="card"><div class="actions" style="margin-bottom:15px"><button class="btn btn-primary" onclick="openUser()">+ Novo usuário</button></div><div id="table"></div></div><div id="modal" class="modal-back"><div class="modal"><div class="modal-head"><h2>Novo usuário</h2><button class="close" onclick="closeModal()">×</button></div><form id="uf"><div class="field"><label>Nome</label><input id="unome" required></div><br><div class="field"><label>E-mail</label><input id="uemail" type="email" required></div><br><div class="field"><label>Senha</label><input id="usenha" required></div><br><button class="btn btn-primary">Cadastrar</button></form></div></div>`);
function draw(){const d=getDB();table.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Ação</th></tr></thead><tbody>${d.users.map(u=>`<tr><td>${u.id}</td><td>${esc(u.nome)}</td><td>${esc(u.email)}</td><td><button class="btn btn-danger btn-small" onclick="delUser(${u.id})">Excluir</button></td></tr>`).join('')}</tbody></table></div>`}
window.openUser=()=>modal.classList.add('show');window.closeModal=()=>modal.classList.remove('show');
uf.onsubmit=e=>{e.preventDefault();const d=getDB();if(d.users.some(u=>u.email===uemail.value)){alert('E-mail já cadastrado.');return}d.users.push({id:d.nextId++,nome:unome.value,email:uemail.value,senha:usenha.value});saveDB(d);closeModal();uf.reset();draw();toast('Usuário cadastrado.')};
window.delUser=id=>{if(!confirm('Excluir usuário?'))return;const d=getDB();d.users=d.users.filter(u=>u.id!==id);d.reservations=d.reservations.filter(r=>r.userId!==id);saveDB(d);draw();toast('Usuário excluído.')};draw();}
</script></body></html>
