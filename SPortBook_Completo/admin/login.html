<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin | SPortBook</title><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head>
<body><div class="login-page"><div class="login-card"><img src="../img/logo-sportbook.png" class="logo"><h1>Área Administrativa</h1><p class="subtitle">Acesso exclusivo para administradores</p>
<form id="form"><div class="field" style="text-align:left"><label>E-mail</label><input id="email" type="email" required></div><br><div class="field" style="text-align:left"><label>Senha</label><input id="senha" type="password" required></div><br><button class="btn btn-primary" style="width:100%">Entrar</button></form><p id="msg" style="color:#c94747;margin-top:14px;font-size:13px"></p><p class="demo">Demo: admin@sportbook.com / admin123</p></div></div>
<script>form.onsubmit=e=>{e.preventDefault();const db=getDB(),u=db.admins.find(x=>x.email===email.value&&x.senha===senha.value);if(!u){msg.textContent='Dados administrativos incorretos.';return}setSession({role:'admin',id:u.id,nome:u.nome,email:u.email});location.href='inicio.html'}</script></body></html>
