<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horários | SPortBook</title><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body><script>
const s=requireSession('admin');if(s){const d=getDB();renderLayout('admin','horarios.html','Horários',`<div class="hero"><h1>Indisponibilizar horários</h1><p>Bloqueie períodos para manutenção, eventos ou outros motivos.</p></div><div class="grid"><section class="card"><h2>Novo bloqueio</h2><form id="bf"><div class="field"><label>Quadra</label><select id="bq">${d.quadras.map(q=>`<option value="${q.id}">${esc(q.nome)} - ${esc(q.tipo)}</option>`).join('')}</select></div><br><div class="field"><label>Data</label><input id="bd" type="date" min="${todayISO()}" required></div><br><div class="form-grid"><div class="field"><label>Início</label><input id="bi" type="time" value="08:00" required></div><div class="field"><label>Fim</label><input id="bfim" type="time" value="09:00" required></div></div><br><button class="btn btn-primary">Bloquear horário</button></form></section><section class="card"><h2>Bloqueios existentes</h2><div id="list"></div></section></div>`);
function draw(){const d=getDB();list.innerHTML=d.blocked.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Quadra</th><th>Data</th><th>Horário</th><th>Ação</th></tr></thead><tbody>${d.blocked.map(x=>{const q=d.quadras.find(q=>q.id===x.quadraId);return `<tr><td>${esc(q?.nome)}</td><td>${dateBR(x.data)}</td><td>${x.inicio} - ${x.fim}</td><td><button class="btn btn-danger btn-small" onclick="removeBlock(${x.id})">Remover</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Nenhum horário bloqueado.</div>'}
bf.onsubmit=e=>{e.preventDefault();const d=getDB();if(timeToMin(bi.value)>=timeToMin(bfim.value)){toast('O fim deve ser depois do início.');return}if(isConflict(d,Number(bq.value),bd.value,bi.value,bfim.value)){toast('Existe uma reserva nesse período.');return}d.blocked.push({id:d.nextId++,quadraId:Number(bq.value),data:bd.value,inicio:bi.value,fim:bfim.value});saveDB(d);bf.reset();draw();toast('Horário bloqueado.')};
window.removeBlock=id=>{const d=getDB();d.blocked=d.blocked.filter(x=>x.id!==id);saveDB(d);draw();toast('Bloqueio removido.')};draw();}
</script></body></html>
