<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservas | SPortBook</title><link rel="stylesheet" href="../css/style.css"><script src="../js/app.js"></script></head><body><script>
const s=requireSession('admin');if(s){renderLayout('admin','reservas.html','Reservas',`<div class="hero"><h1>Reservas</h1><p>Visualize e gerencie todas as reservas.</p></div><div class="card"><div id="table"></div></div>`);
function draw(){const d=getDB();const rs=d.reservations.slice().sort((a,b)=>a.data.localeCompare(b.data));table.innerHTML=rs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Usuário</th><th>Quadra</th><th>Data</th><th>Horário</th><th>Status</th><th>Ação</th></tr></thead><tbody>${rs.map(r=>{const q=d.quadras.find(x=>x.id===r.quadraId);return `<tr><td>${esc(r.userNome)}</td><td>${esc(q?.nome)}</td><td>${dateBR(r.data)}</td><td>${r.inicio} - ${r.fim}</td><td><span class="status ${r.status==='confirmed'?'confirmed':'cancelled'}">${r.status==='confirmed'?'Confirmada':'Cancelada'}</span></td><td>${r.status==='confirmed'?`<button class="btn btn-danger btn-small" onclick="cancelRes(${r.id})">Cancelar</button>`:'-'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma reserva.</div>'}
window.cancelRes=id=>{if(!confirm('Cancelar reserva?'))return;const d=getDB(),r=d.reservations.find(x=>x.id===id);if(r){r.status='cancelled';saveDB(d);draw();toast('Reserva cancelada.')}};draw();}
</script></body></html>
